services:
  - type: web
    name: laravel-inertia-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false          # paste your generated key manually in Render's dashboard
      - key: APP_URL
        sync: false          # set to your onrender.com URL after first deploy
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: cookie        # avoids relying on the ephemeral filesystem for sessions
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: laravel-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: laravel-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: laravel-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: laravel-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: laravel-db
          property: password

databases:
  - name: laravel-db
    plan: free
    databaseName: laravel
    user: laravel