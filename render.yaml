services:
  - type: web
    name: laravel-inertia-app
    runtime: docker
    plan: free
    branch: main
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false  # You will set this manually in the dashboard
      - key: APP_URL
        value: https://laravel-inertia-app.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: laravel-db
          property: connectionString
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
    disk:
      name: storage
      mountPath: /var/www/html/storage/app
      sizeGB: 1

databases:
  - name: laravel-db
    databaseName: laravel
    user: laravel
    plan: free